name: Check and Test
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: install-ubuntu
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: install-windows
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: post install
        run: |
          moon version --all
          moon update
      - name: migrate legacy dependency manifests
        shell: bash
        run: |
          # Latest moon toolchains reject the legacy moon.mod.json manifest
          # still shipped by bikallem/blit and bikallem/compress. Download
          # the dependencies first, then migrate those manifests with
          # `moon fmt` (the officially suggested migration path) before any
          # build or check.
          moon install
          for d in $(find .mooncakes -name moon.mod.json | xargs -r dirname); do
            echo "migrating $d"
            (cd "$d" && moon fmt)
          done
      - name: moon build
        run: |
          moon build --target native
      - name: moon check
        run: |
          moon check --target native --deny-warn
      - name: moon test
        run: |
          moon test --target native
      - name: lint
        run: |
          moon fmt && git diff --exit-code
          moon info && git diff --exit-code
