name: Check and Test
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: install-ubuntu
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: install-windows
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: post install
        run: |
          moon version --all
          moon update
      - name: migrate legacy dependency manifests
        shell: bash
        run: |
          # Latest moon toolchains reject the legacy moon.mod.json manifest
          # still shipped by bikallem/blit and bikallem/compress. A first
          # build downloads the deps (and fails on the legacy manifest);
          # migrate those manifests with `moon fmt` (the officially
          # suggested migration path), then the next build succeeds.
          for i in 1 2 3 4 5; do
            moon build --target native && break
            if ! find .mooncakes -name moon.mod.json 2>/dev/null | grep -q .; then
              echo "no more legacy manifests; the failing build is real"
              break
            fi
            for d in $(find .mooncakes -name moon.mod.json | xargs -r dirname); do
              echo "migrating $d"
              (cd "$d" && moon fmt)
            done
          done
      - name: moon build
        run: |
          moon build --target native
      - name: moon check
        run: |
          moon check --target native --deny-warn
      - name: moon test
        run: |
          moon test --target native
      - name: lint
        run: |
          moon fmt && git diff --exit-code
          moon info && git diff --exit-code
